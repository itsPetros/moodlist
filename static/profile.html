<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbf9ff" media="(prefers-color-scheme: light)">
<title>Your profile · MoodList</title>
<link rel="stylesheet" href="/static/profile.css">
<script src="/static/profile.js" defer></script>
</head>
<body>
<noscript><p class="pf-error" style="padding:16px">MoodList needs JavaScript to work.</p></noscript>

<header class="pf-bar">
  <a class="pf-back" href="/" aria-label="Back to MoodList">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    <img src="/static/icons/icon-192.png" alt="" width="28" height="28">
    <span>MoodList</span>
  </a>
  <button type="button" class="pf-btn" id="logout">Log out</button>
</header>

<main class="pf">
  <section class="pf-hero" aria-label="Your profile">
    <button type="button" class="pf-avatar" id="avatar-btn" aria-label="Change profile picture" title="Change profile picture">
      <img id="avatar" src="/static/icons/icon-192.png" alt="">
      <span class="pf-avatar-edit" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </span>
    </button>
    <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp" hidden>
    <div class="pf-who">
      <h1 id="name">&nbsp;</h1>
      <p class="pf-muted" id="email"></p>
      <p class="pf-muted pf-small" id="since"></p>
    </div>
  </section>

  <section class="pf-moods" id="moods" aria-label="Your top moods" hidden>
    <h2>Your top moods</h2>
    <ul class="pf-chips" id="mood-list"></ul>
  </section>

  <div class="pf-tabs" role="tablist" aria-label="Playlists">
    <button type="button" role="tab" id="tab-saved" aria-controls="panel-saved" aria-selected="true">
      Saved <span class="pf-count" id="count-saved">0</span>
    </button>
    <button type="button" role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" tabindex="-1">
      History <span class="pf-count" id="count-history">0</span>
    </button>
  </div>

  <p class="pf-error" id="error" role="alert" hidden></p>

  <section id="panel-saved" role="tabpanel" aria-labelledby="tab-saved" class="pf-panel"></section>
  <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" class="pf-panel" hidden></section>
</main>

<div id="toast" class="pf-toast" role="status" aria-live="polite"></div>
</body>
</html>
